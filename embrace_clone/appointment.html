  <head>

    <meta content="https://embracelives.com/og-image.png" property="og:image" />

      content="Schedule your therapy session with eMbrace. Book online or in-person appointments with our clinical psychologists, child therapists &amp; counsellors in Delhi."
      name="twitter:description"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "name": "eMbrace Lives",
        "alternateName": "eMbrace - SMD Wellness",
        "url": "https://embracelives.com",
        "logo": "https://embracelives.com/Logo.svg",
        "description": "Leading psychology and mental health practice in Delhi offering evidence-based therapy, assessments, and neurodevelopmental care for children, adolescents, and adults.",
        "telephone": "+919971576800",
        "email": "info@embracelives.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Delhi",
          "addressRegion": "Delhi",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "28.6139",
          "longitude": "77.2090"
        },
        "priceRange": "$$",
        "medicalSpecialty": ["Psychiatric", "ClinicalPsychology"],
        "availableService": [
          { "@type": "MedicalTherapy", "name": "Child Psychology" },
          { "@type": "MedicalTherapy", "name": "Clinical Psychology" },
          { "@type": "MedicalTherapy", "name": "Couples Therapy" },
          { "@type": "MedicalTherapy", "name": "ADHD Assessment" },
          { "@type": "MedicalTherapy", "name": "Autism Assessment" },
          { "@type": "MedicalTherapy", "name": "CBT for Anxiety & Depression" }
        ],
        "sameAs": [
          "https://www.linkedin.com/company/embracelives/",
          "https://www.instagram.com/embracelives/",
          "https://www.facebook.com/embracelives22/"
        ]
      }
    </script>
    <title>Book an Appointment | eMbrace Lives</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="./_external/fonts.googleapis.com/css2_4d2f350a.css" rel="stylesheet" />

    <link href="./assets/index-B-kGA3UA.css" rel="stylesheet" />
    <style></style>
  </head>
  <body>
    <div id="root">
      <div id="header-placeholder"></div>
      <!-- Book an Appointment Section -->
      
            <main class="px-4 md:px-8 lg:px-16 xl:px-24 py-16 bg-[#F8F2FF] min-h-[70vh] flex justify-center items-center relative overflow-hidden">
        <!-- Decorative blobs for background -->
        <div class="absolute top-10 left-10 w-64 h-64 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        <div class="absolute bottom-10 right-10 w-64 h-64 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        
        <div class="w-full max-w-4xl relative rounded-3xl overflow-hidden z-10" style="background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 32px 0 rgba(31,38,135,0.15);">
          
          <div class="flex border-b border-gray-300/50 relative" style="z-index: 10; background: rgba(255, 255, 255, 0.3);">
             <button id="page-tab-new" class="flex-1 py-6 text-center font-bold text-xl md:text-2xl border-b-4 border-[var(--blue-fig)] text-[var(--blue-fig)] transition-colors cursor-pointer" style="background: rgba(255,255,255,0.6);">New Patient</button>
             <button id="page-tab-existing" class="flex-1 py-6 text-center font-bold text-xl md:text-2xl border-b-4 border-transparent text-gray-600 hover:text-gray-900 transition-colors cursor-pointer" style="background: transparent;">Existing Patient</button>
          </div>
          
          <div class="p-8 md:p-12 relative" style="z-index: 10;">
             <div id="page-content-new" class="transition-opacity duration-300">
                <form accept-charset='UTF-8' action='https://app.formester.com/forms/6rj1mkdNE/submissions' method='POST' class="flex flex-col gap-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label for="name" class="font-medium text-gray-700">Patient Name *</label>
                        <input type="text" id="name" name="name" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="parent_name" class="font-medium text-gray-700">Parent/Guardian Name *</label>
                        <input type="text" id="parent_name" name="parent_name" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label for="email" class="font-medium text-gray-700">Email Address *</label>
                        <input type="email" id="email" name="email" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="phone" class="font-medium text-gray-700">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label for="location" class="font-medium text-gray-700">Preferred Location *</label>
                        <select id="location" name="location" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                            <option value="">Select Location</option>
                            <option value="online">Online (All India)</option>
                            <option value="vasant_kunj">eMbrace Vasant Kunj</option>
                            <option value="dlf_gurgaon">eMbrace DLF City Court, Gurgaon</option>
                            <option value="rainbow_hospital">eMbrace Rainbow Children's Hospital</option>
                            <option value="makkar_hospital">eMbrace Makkar Hospital</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="age_group" class="font-medium text-gray-700">Age Group *</label>
                        <select id="age_group" name="age_group" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                            <option value="">Select Age Group</option>
                            <option value="infants">Infants (0–2 yrs)</option>
                            <option value="toddlers">Toddlers (3–5 yrs)</option>
                            <option value="school_age">School-Age (6–11 yrs)</option>
                            <option value="pre_teens">Pre-Teens (12–14 yrs)</option>
                            <option value="teenagers">Teenagers (15–18 yrs)</option>
                            <option value="adults">Adults (18+)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label for="specialty" class="font-medium text-gray-700">Specialty *</label>
                        <select id="specialty" name="specialty" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                            <option value="">Select Specialty</option>
                            <option value="clinical_psychologist">Clinical Psychologist</option>
                            <option value="child_psychologist">Child Psychologist</option>
                            <option value="psychiatrist">Psychiatrist</option>
                            <option value="occupational_therapist">Occupational Therapist</option>
                            <option value="speech_language_therapist">Speech & Language Therapist</option>
                            <option value="physiotherapist">Physiotherapist</option>
                            <option value="special_educator">Special Educator</option>
                            <option value="couples_therapist">Couples Therapist</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="condition" class="font-medium text-gray-700">Condition Treated *</label>
                        <select id="condition" name="condition" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                            <option value="">Select Condition</option>
                            <option value="anxiety_stress">Anxiety & Stress</option>
                            <option value="depression">Depression</option>
                            <option value="adhd">ADHD</option>
                            <option value="autism_asd">Autism / ASD</option>
                            <option value="speech_delay">Speech Delay</option>
                            <option value="learning_disability">Learning Disability</option>
                            <option value="sensory_processing">Sensory Processing</option>
                            <option value="ocd">OCD</option>
                            <option value="trauma_ptsd">Trauma / PTSD</option>
                            <option value="relationship_issues">Relationship Issues</option>
                            <option value="child_adolescent">Child & Adolescent</option>
                            <option value="grief_loss">Grief & Loss</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label for="appointment_date" class="font-medium text-gray-700">Preferred Date *</label>
                        <input type="date" id="appointment_date" name="appointment_date" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="appointment_time" class="font-medium text-gray-700">Preferred Time *</label>
                        <input type="time" id="appointment_time" name="appointment_time" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]">
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="message" class="font-medium text-gray-700">Message / Concern</label>
                    <textarea id="message" name="message" rows="5" placeholder="Please describe your concern or requirements" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#234394] focus:ring-1 focus:ring-[#234394]"></textarea>
                </div>

                <button type="submit" class="w-full md:w-auto self-center mt-4 bg-[var(--blue-fig)] text-white font-semibold text-lg px-10 py-3 rounded-full hover:scale-105 transition-transform duration-200 cursor-pointer">Book Appointment</button>
            </form>
             </div>
             
             <div id="page-content-existing" class="hidden flex flex-col items-center justify-center py-16 gap-6 transition-opacity duration-300">
                <div class="w-24 h-24 rounded-full flex items-center justify-center mb-4" style="background: rgba(16, 185, 129, 0.1);">
                    <svg class="w-12 h-12" style="color: #10B981;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-3xl font-bold text-center text-gray-800">Welcome back!</h3>
                <p class="text-xl text-center text-gray-700 mb-4">Please click below to access our partner portal and securely book your next session.</p>
                <a href="https://meet-my-doctor.firebaseapp.com/#/app?eid=47033" target="_blank" class="bg-[var(--blue-fig)] text-white font-semibold text-xl px-16 py-5 rounded-full hover:scale-105 transition-transform duration-300 cursor-pointer inline-block" style="box-shadow: 0 4px 15px rgba(35, 67, 148, 0.3);">Book the Appointment</a>
             </div>
          </div>
      </div>
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const tabNew = document.getElementById('page-tab-new');
          const tabExisting = document.getElementById('page-tab-existing');
          const contentNew = document.getElementById('page-content-new');
          const contentExisting = document.getElementById('page-content-existing');
          
          if(tabNew && tabExisting) {
            tabNew.addEventListener('click', () => {
              tabNew.classList.remove('border-transparent', 'text-gray-600');
              tabNew.classList.add('border-[var(--blue-fig)]', 'text-[var(--blue-fig)]');
              tabNew.style.background = 'rgba(255,255,255,0.6)';
              
              tabExisting.classList.remove('border-[var(--blue-fig)]', 'text-[var(--blue-fig)]');
              tabExisting.classList.add('border-transparent', 'text-gray-600');
              tabExisting.style.background = 'transparent';
              
              contentNew.classList.remove('hidden');
              contentExisting.classList.add('hidden');
            });

            tabExisting.addEventListener('click', () => {
              tabExisting.classList.remove('border-transparent', 'text-gray-600');
              tabExisting.classList.add('border-[var(--blue-fig)]', 'text-[var(--blue-fig)]');
              tabExisting.style.background = 'rgba(255,255,255,0.6)';
              
              tabNew.classList.remove('border-[var(--blue-fig)]', 'text-[var(--blue-fig)]');
              tabNew.classList.add('border-transparent', 'text-gray-600');
              tabNew.style.background = 'transparent';
              
              contentExisting.classList.remove('hidden');
              contentNew.classList.add('hidden');
            });
          }
        });
      </script>
      </main>

      <div id="footer-placeholder"></div>
    </div>
    
    <script src="./assets/interactive.js"></script>
  </body>
</html>
