<!DOCTYPE html>
<!-- TEMPORARY: measures CTA buttons for text overflow. Delete before deploy. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0}iframe{width:1200px;height:900px;border:0}pre{font:11px monospace}</style></head>
<body>
<iframe id="f" src="<?php echo htmlspecialchars($_GET['u'] ?? '/adolescents'); ?>"></iframe>
<pre id="probe">running…</pre>
<script>
document.getElementById('f').addEventListener('load', function () {
  var doc = this.contentDocument, win = this.contentWindow;
  setTimeout(function () {
    var out = [];
    var nodes = [].slice.call(doc.querySelectorAll('a, button'));
    nodes.forEach(function (el) {
      var txt = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (!txt || txt.length > 40) return;
      var cs = win.getComputedStyle(el);
      var r = el.getBoundingClientRect();
      if (r.height === 0) return;
      var fs = parseFloat(cs.fontSize);
      var lh = cs.lineHeight === 'normal' ? fs * 1.2 : parseFloat(cs.lineHeight);
      var padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
      var needed = lh + padT + padB;
      var tight = r.height + 0.5 < needed || lh < fs * 1.05;
      if (tight) {
        out.push({
          text: txt.slice(0, 30),
          box: Math.round(r.height * 10) / 10,
          needs: Math.round(needed * 10) / 10,
          fontSize: fs, lineHeight: cs.lineHeight,
          padding: cs.paddingTop + '/' + cs.paddingBottom,
          display: cs.display,
          cls: (el.className || '').toString().slice(0, 90),
        });
      }
    });
    document.getElementById('probe').textContent =
      out.length ? JSON.stringify(out, null, 1) : 'no tight buttons found';
  }, 2500);
});
</script>
</body></html>
