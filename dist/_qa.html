<!DOCTYPE html>
<!-- TEMPORARY QA probe: loads a page in an iframe and reports rendering,
     button styling, failed requests and resource weight. Delete before deploy. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0}iframe{width:390px;height:1200px;border:0}pre{font:11px monospace}</style></head>
<body>
<iframe id="f" src="<?php echo htmlspecialchars($_GET['u'] ?? '/'); ?>"></iframe>
<pre id="probe">running…</pre>
<script>
var errors = [];
window.addEventListener('error', function (e) { errors.push('parent:' + e.message); }, true);

document.getElementById('f').addEventListener('load', function () {
  var doc = this.contentDocument, win = this.contentWindow;
  win.addEventListener('error', function (e) {
    errors.push((e.message || 'resource error') + ' @ ' + ((e.target && (e.target.src || e.target.href)) || 'inline'));
  }, true);

  setTimeout(function () {
    var out = {};

    // --- buttons and CTAs: is anything rendering unstyled? ---
    var btns = [].slice.call(doc.querySelectorAll('a[class*="btn"], button, a[class*="glass"], .lm-btn, [class*="rounded-full"]'));
    var unstyled = [];
    btns.forEach(function (b) {
      var cs = win.getComputedStyle(b);
      var r = b.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) return;             // hidden, fine
      var noBg = cs.backgroundColor === 'rgba(0, 0, 0, 0)' || cs.backgroundColor === 'transparent';
      var noBorder = cs.borderTopWidth === '0px';
      var noRadius = cs.borderRadius === '0px';
      var looksLikePlainText = noBg && noBorder && noRadius && cs.padding === '0px';
      if (looksLikePlainText) {
        unstyled.push((b.tagName + '.' + (b.className || '').toString().split(/\s+/).slice(0, 3).join('.')).slice(0, 70)
          + ' «' + (b.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 28) + '»');
      }
    });
    out.buttons = { total: btns.length, unstyled: unstyled.slice(0, 8), unstyledCount: unstyled.length };

    // --- images: broken, missing dimensions, oversized for their box ---
    var imgs = [].slice.call(doc.images);
    var broken = [], noDims = [], oversized = [];
    imgs.forEach(function (im) {
      var r = im.getBoundingClientRect();
      if (im.complete && im.naturalWidth === 0) broken.push(im.currentSrc || im.src);
      if (!im.getAttribute('width') || !im.getAttribute('height')) noDims.push((im.currentSrc || im.src).split('/').pop());
      if (im.naturalWidth && r.width && im.naturalWidth > r.width * 2.5 && r.width > 0) {
        oversized.push((im.currentSrc || im.src).split('/').pop() + ' ' + im.naturalWidth + 'px natural vs ' + Math.round(r.width) + 'px shown');
      }
    });
    out.images = {
      total: imgs.length, broken: broken.slice(0, 6), brokenCount: broken.length,
      missingDimensions: noDims.length, oversized: oversized.slice(0, 6), oversizedCount: oversized.length,
      lazy: imgs.filter(function (i) { return i.loading === 'lazy'; }).length,
    };

    // --- render blocking in <head> ---
    var headScripts = [].slice.call(doc.querySelectorAll('head script[src]'));
    out.renderBlocking = {
      headScripts: headScripts.filter(function (s) { return !s.async && !s.defer; })
        .map(function (s) { return s.src.replace(/^https?:\/\//, '').slice(0, 70); }),
      stylesheets: doc.querySelectorAll('link[rel="stylesheet"]').length,
    };

    // --- resource weight ---
    var res = win.performance.getEntriesByType('resource');
    var byType = {};
    var total = 0;
    res.forEach(function (r) {
      var t = r.initiatorType || 'other';
      byType[t] = byType[t] || { n: 0, bytes: 0 };
      byType[t].n++;
      byType[t].bytes += r.transferSize || 0;
      total += r.transferSize || 0;
    });
    out.weight = { totalKB: Math.round(total / 1024), requests: res.length, byType: {} };
    Object.keys(byType).forEach(function (k) {
      out.weight.byType[k] = byType[k].n + ' req, ' + Math.round(byType[k].bytes / 1024) + ' KB';
    });
    out.heaviest = res.slice().sort(function (a, b) { return (b.transferSize || 0) - (a.transferSize || 0); })
      .slice(0, 8).map(function (r) {
        return Math.round((r.transferSize || 0) / 1024) + ' KB  ' + r.name.replace(/^https?:\/\//, '').split('?')[0].slice(-60);
      });

    out.errors = errors.slice(0, 8);
    out.docHeight = doc.documentElement.scrollWidth + 'x' + doc.documentElement.scrollHeight;

    document.getElementById('probe').textContent = JSON.stringify(out, null, 1);
  }, 3500);
});
</script>
</body></html>
